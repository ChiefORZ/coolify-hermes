# Restore the real scheme (Coolify's Traefik terminates TLS, forwards as HTTP)
map $http_x_forwarded_proto $real_scheme {
    default $scheme;
    https   https;
    http    http;
}

# /assets/ and /favicon.ico exist in both tinyauth and dashboard — split by Referer.
# Default to dashboard; if the Referer is a tinyauth page route to tinyauth instead.
map $http_referer $shared_upstream {
    default                                                                                        "dashboard:9119";
    "~*^https?://[^/]+/(login|logout|continue|unauthorized|forgot-password|totp|error)(\?|$|/)"  "tinyauth:3000";
}

server {
    listen 8080;

    # Docker's embedded DNS resolver — defers all upstream resolution to request time
    # so nginx starts successfully even if upstream containers aren't ready yet
    resolver 127.0.0.11 valid=30s ipv6=off;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $real_scheme;

    # forward-auth subrequest to tinyauth
    location = /_tinyauth_check {
        internal;
        set $tinyauth "tinyauth:3000";
        proxy_pass http://$tinyauth/api/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header Content-Length     "";
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Proto  $real_scheme;
        proxy_set_header X-Forwarded-URI    $request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
    }

    # Unauthenticated → redirect to /login
    location @signin {
        return 302 $real_scheme://$host/login?redirect_uri=$real_scheme://$host$request_uri;
    }

    # tinyauth's own UI
    location ~ ^/(login|logout|continue|unauthorized|forgot-password)$ {
        set $tinyauth "tinyauth:3000";
        proxy_pass http://$tinyauth;
    }

    # tinyauth's API endpoints (all prefixes found in its JS bundle)
    location ~ ^/api/(context|user|auth|oauth|oidc|healthcheck|login|logout|totp)(/|$) {
        set $tinyauth "tinyauth:3000";
        proxy_pass http://$tinyauth;
    }

    # Paths that exist in both tinyauth and dashboard — split by Referer.
    # Fallback: if the Referer-selected upstream returns 404, try the other one.
    location /assets/ {
        proxy_intercept_errors on;
        error_page 404 = @assets_fallback;
        set $upstream $shared_upstream;
        proxy_pass http://$upstream;
    }

    location @assets_fallback {
        set $upstream $shared_upstream;
        # Switch to the other upstream
        set $fallback "dashboard:9119";
        if ($upstream = "dashboard:9119") {
            set $fallback "tinyauth:3000";
        }
        proxy_pass http://$fallback;
    }

    location = /favicon.ico {
        proxy_intercept_errors on;
        error_page 404 = @favicon_fallback;
        set $upstream $shared_upstream;
        proxy_pass http://$upstream;
    }

    location @favicon_fallback {
        set $upstream $shared_upstream;
        set $fallback "dashboard:9119";
        if ($upstream = "dashboard:9119") {
            set $fallback "tinyauth:3000";
        }
        proxy_pass http://$fallback;
    }

    # Everything else: require auth, proxy to dashboard
    location / {
        auth_request /_tinyauth_check;
        error_page 401 = @signin;

        set $dashboard "dashboard:9119";
        proxy_pass http://$dashboard;

        # WebSocket support (dashboard uses it for live updates)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
