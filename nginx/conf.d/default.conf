# Restore the real scheme (Coolify's Traefik terminates TLS, forwards as HTTP)
map $http_x_forwarded_proto $real_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 8080;

    # Docker's embedded DNS resolver — defers upstream resolution to request time
    resolver 127.0.0.11 valid=30s ipv6=off;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $real_scheme;

    location / {
        auth_basic "Hermes Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;

        set $dashboard "dashboard:9119";
        proxy_pass http://$dashboard;

        # WebSocket support (dashboard uses it for live updates)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
