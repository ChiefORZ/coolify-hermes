services:
  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: gateway run
    volumes:
      - hermes-data:/opt/data
    networks:
      - hermes-net
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  dashboard:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: dashboard --host 0.0.0.0 --insecure
    volumes:
      - hermes-data:/opt/data
    environment:
      - GATEWAY_HEALTH_URL=http://hermes:8642
    networks:
      - hermes-net
    depends_on:
      - hermes
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:latest
    restart: unless-stopped
    environment:
      - SECRET=${TINYAUTH_SECRET}
      - APP_URL=https://${SERVICE_FQDN_NGINX_8080}
      - USERS=${TINYAUTH_USERS}
    networks:
      - hermes-net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hermes-net
    depends_on:
      - dashboard
      - tinyauth

volumes:
  hermes-data:

networks:
  hermes-net:
    driver: bridge
