services:
  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: gateway run
    volumes:
      - hermes-data:/opt/data
    environment:
      # At least one LLM provider key is required to run Hermes. Set the environment variables for the providers you want to use.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  dashboard:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: dashboard --host 0.0.0.0 --insecure
    volumes:
      - hermes-data:/opt/data
    environment:
      - GATEWAY_HEALTH_URL=http://hermes:8642
    depends_on:
      - hermes
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  tinyauth:
    image: ghcr.io/steveiliop56/tinyauth:latest
    restart: unless-stopped
    environment:
      - TINYAUTH_SECRET=${TINYAUTH_SECRET}
      - TINYAUTH_APPURL=${HERMES_URL}
      - TINYAUTH_AUTH_USERS=${TINYAUTH_USERS}
      - TINYAUTH_LOG_LEVEL=${TINYAUTH_LOG_LEVEL:-info}
      - TINYAUTH_LOG_STREAMS_AUDIT_ENABLED=${TINYAUTH_LOG_AUDIT:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      tinyauth:
        condition: service_healthy
      dashboard:
        condition: service_started

volumes:
  hermes-data:
